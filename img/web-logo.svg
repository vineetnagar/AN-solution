<svg viewBox="0 0 980 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132A46"/>
      <stop offset="100%" stop-color="#1E4470"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#E08E1D"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#F5D98A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1B30" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ===== ICON BADGE ===== -->
  <g filter="url(#softShadow)">
    <rect x="20" y="30" width="220" height="220" rx="52" fill="url(#bgGrad)"/>
    <rect x="20" y="30" width="220" height="220" rx="52" fill="none" stroke="#0B1B30" stroke-width="2" opacity="0.4"/>

    <!-- Monogram A + N -->
    <g fill="#F5F7FA" transform="translate(-6,0)">
      <path d="M78 190 L120 88 L134 88 L176 190 L156 190 L145 162 L109 162 L98 190 Z
               M115 146 L139 146 L127 112 Z" fill-rule="evenodd"/>
      <path d="M158 190 L158 88 L176 88 L216 156 L216 88 L232 88 L232 190 L216 190 L176 122 L176 190 Z"/>
    </g>

    <!-- Checkmark accent -->
    <circle cx="205" cy="203" r="30" fill="url(#checkGrad)" stroke="#132A46" stroke-width="4"/>
    <path d="M193 203 L202 212 L219 192" fill="none" stroke="#132A46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g font-family="'Poppins','Segoe UI',Arial,sans-serif">
    <text x="282" y="150" font-size="84" font-weight="700" fill="#132A46">
      AN Solution
    </text>

    <!-- Accent underline swoosh -->
    <path d="M284 172 C 460 200, 640 200, 792 172" fill="none" stroke="url(#checkGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <!-- Tagline -->
    <text x="284" y="220" font-size="30" font-weight="500" letter-spacing="3" fill="#5B6B80">
      ONLINE ASSIGNMENT ASSISTANT
    </text>
  </g>
</svg>
